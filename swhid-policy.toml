# SWHID Verification Tool - Compliance Policy
# This file configures the policy engine for CI/CD gatekeeping.
#
# Design intent: `fail_on_mismatch` is the gate that matters for a
# verification tool - it fails the build if a resolved SWHID no longer
# cryptographically matches the archive, i.e. the tool's core guarantee
# broke. Vulnerability severity is a separate, faster-moving concern (new
# CVEs get disclosed against pinned floors constantly and are unrelated to
# whether SWHID resolution itself is correct), so its threshold is kept
# high enough that routine disclosures don't block releases; genuinely
# critical ones still do.

[policy]
# Fail the build if any local file/directory has a cryptographic mismatch against the archive
fail_on_mismatch = true

# The minimum confidence level required for dependencies.
# We allow "Partial" to account for Software Heritage archival lag of newly installed packages.
minimum_confidence_level = "Partial"

# Do not hard-fail on every vulnerability - only block on max_severity and above
fail_on_vulnerability = false
max_severity = "CRITICAL"

# Allowlist for private or internal packages
allowlist = []

# Vulnerability IDs to ignore on a case-by-case basis, with a reason.
ignored_vulnerabilities = []
